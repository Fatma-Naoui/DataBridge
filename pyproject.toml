[project]
name = "databridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"